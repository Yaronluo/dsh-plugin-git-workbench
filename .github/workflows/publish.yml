name: Publish

# Publishes the package to npm, which is what lets storefronts show a download
# count and install without a build step. It needs an npm automation token in
# the NPM_TOKEN repository secret — a granular access token with read/write on
# this package, which also bypasses interactive 2FA. Without the secret the job
# reports a warning and exits green, so releases keep working either way.
#
# The registry is pinned in package.json (`publishConfig`) on purpose: a
# developer ~/.npmrc may point at a read-only mirror such as
# registry.npmmirror.com, where `npm publish` cannot succeed.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set - skipping npm publish"
            exit 0
          fi
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm - nothing to publish"
            exit 0
          fi
          # `prepublishOnly` rebuilds, typechecks and tests before the upload.
          npm publish
          echo "published $name@$version"
