name: Publish

# Publishes the package to npm, which is what lets storefronts show a download
# count and install without a build step. It needs a granular npm token in
# the NPM_TOKEN repository secret, with package publish permissions and the
# appropriate 2FA policy. Without the secret no package is published.
# A release created with GITHUB_TOKEN does not trigger release-event workflows;
# workflow_run therefore follows the successful Release workflow instead.
#
# The registry is pinned in package.json (`publishConfig`) on purpose: a
# developer ~/.npmrc may point at a read-only mirror such as
# registry.npmmirror.com, where `npm publish` cannot succeed.

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set - no npm package was published"
            echo "npm publication was skipped: configure the NPM_TOKEN repository secret or publish locally after npm login." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm - nothing to publish"
            exit 0
          fi
          # `prepublishOnly` rebuilds, typechecks and tests before the upload.
          npm publish
          echo "published $name@$version"
